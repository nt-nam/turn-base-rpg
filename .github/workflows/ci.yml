name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  screen-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/screen-catalog/catalog.mjs --check

  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --settings-file settings-test.gradle :game:domain:test :game:application:test :game:screens:test :game:content:test :game:infrastructure:test :game:content:compileContent :game:client:test :server:app:test :core:test :lwjgl3:compileJava
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            game/*/build/reports/tests
            server/*/build/reports/tests
            core/build/reports/tests

  desktop-agent:
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglu1-mesa
      - run: chmod +x gradlew tools/test-agent/run-desktop.sh
      - name: core loop scenario
        run: xvfb-run -a -s "-screen 0 1280x720x24" tools/test-agent/run-desktop.sh "$PWD/agent-reports/scenario"
      - name: chapter 1 playthrough
        run: SCENARIO=chapter1 xvfb-run -a -s "-screen 0 1280x720x24" tools/test-agent/run-desktop.sh "$PWD/agent-reports/chapter1"
      - name: explorer coverage
        run: MODE=explore xvfb-run -a -s "-screen 0 1280x720x24" tools/test-agent/run-desktop.sh "$PWD/agent-reports/explore"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-reports
          path: agent-reports

  console-agent:
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew tools/test-agent/console/run-console.sh
      - run: tools/test-agent/console/run-console.sh --out="$PWD/agent-reports/console"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-agent-report
          path: agent-reports

  android:
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :game:platform-android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pxworld-android-debug
          path: game/platform-android/build/outputs/apk/debug/*.apk
