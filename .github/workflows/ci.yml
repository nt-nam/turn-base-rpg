name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  screen-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/screen-catalog/catalog.mjs --check

  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --settings-file settings-test.gradle :game:domain:test :game:screens:test :core:test :lwjgl3:compileJava
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            game/*/build/reports/tests
            core/build/reports/tests
