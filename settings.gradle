pluginManagement {
  includeBuild("build-logic")
}

dependencyResolutionManagement {
  repositories {
    mavenCentral()
    google()
  }
}

rootProject.name = 'pxworld'

include 'lwjgl3', 'core', 'android', 'ios', 'html'
include ':game:domain', ':game:application', ':game:screens', ':game:content', ':game:infrastructure', ':game:client', ':game:automation', ':game:platform-desktop', ':game:platform-android'
